<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правила сервера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: top tab bar (pages) -> page header -> sidebar of sections + cards. Content lives in data.json */
:root{
  --bg:#0d0920;
  --panel:#171233;
  --card:#1b1538;
  --nav-on:#2b2354;
  --line:rgba(167,139,250,.16);
  --fg:#f4f0ff;
  --muted:#a59dc6;
  --accent:#8b5cf6;
  --accent-hi:#b39bff;
  --warn-bg:#2a2016;
  --warn-fg:#f5a524;
  --danger:#f0647a;
  --badge:#e5484d;
  --ff-head:'Unbounded','Onest',system-ui,sans-serif;
  --ff-body:'Onest',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 var(--ff-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 15% 0%,rgba(139,92,246,.20),transparent 70%),
             radial-gradient(ellipse 50% 40% at 100% 100%,rgba(109,40,217,.14),transparent 70%)}
.sky::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.7),transparent)}
.star{position:absolute;border-radius:50%;background:#e9e1ff}
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto}

/* top tabs */
.tabs{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:28px;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap;flex:none;transition:background .15s}
.tab:hover{background:rgba(139,92,246,.14)}
.tab.on{background:var(--nav-on)}
.tab svg{flex:none}
.tab .ext{opacity:.55}
.tb{background:var(--badge);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;line-height:1.4}
.tabs .btn{flex:none}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.top svg{flex:none;color:var(--accent)}
.top h1{margin:0;font:700 clamp(22px,4vw,30px)/1.1 var(--ff-head);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.top .grow{flex:1}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{color:var(--muted);font-size:13px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
.nav{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px}
.nav a{display:block;padding:12px 14px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;overflow-wrap:anywhere;transition:background .15s}
.nav a:hover{background:rgba(139,92,246,.14)}
.nav a.on{background:var(--nav-on)}
a:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.nav .add{margin-top:6px}

.rules{display:flex;flex-direction:column;gap:16px;min-width:0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rule-body{display:flex;gap:18px;align-items:flex-start;padding:22px 24px;min-width:0}
.num{flex:none;font:600 22px/1.2 var(--ff-head);color:var(--fg);min-width:52px}
.rule-body p{margin:0;font-weight:600;font-size:15px;white-space:pre-line;overflow-wrap:anywhere;min-width:0;text-wrap:pretty}
.pun{background:var(--warn-bg);color:var(--warn-fg);padding:14px 24px;font-weight:500;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 24px;color:var(--muted)}
.empty b{color:var(--fg)}
.empty a{color:var(--accent-hi)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.card h3{margin:0 0 8px;font:700 17px/1.3 var(--ff-head);overflow-wrap:anywhere}
.card p{margin:0;color:#d9d2f2;white-space:pre-line;overflow-wrap:anywhere}

.btn{font:600 14px var(--ff-body);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;border-radius:10px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--nav-on);border-color:rgba(167,139,250,.4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#7c4be8}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#1a0610}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.field{display:block;width:100%;background:#120d2a;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 15px/1.5 var(--ff-body)}
.field:focus{border-color:var(--accent-hi);outline:none}
textarea.field{resize:vertical;min-height:48px;overflow:hidden}
.ed-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ed-head .field{flex:1;min-width:180px;font-weight:700}
.ed-rule{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:16px;min-width:0}
.ed-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ed-lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.ed-actions{display:flex;flex-direction:column;gap:6px;flex:none}

.ed-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:24px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ed-panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ed-panel h2{margin:0 0 14px;font:600 13px var(--ff-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.export{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.export h2{margin:0 0 8px;font:600 16px var(--ff-head)}
.export p{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:72ch}
.export textarea.field{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;height:260px;overflow:auto;resize:vertical;margin-bottom:12px}
.export code{color:var(--accent-hi)}

/* bans and mutes table */
.pun-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pun-bar .field{width:220px;max-width:100%}
.pun-bar .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn.on{background:var(--nav-on);border-color:rgba(167,139,250,.5)}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tbl{width:100%;min-width:860px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td.nw{white-space:nowrap}
.tbl .pl{font-weight:700}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ban{background:rgba(229,72,77,.18);color:#ff8a93}
.chip.mute{background:var(--warn-bg);color:var(--warn-fg)}
.chip.active{background:rgba(139,92,246,.22);color:var(--accent-hi)}
.chip.ended,.chip.revoked{background:rgba(165,157,198,.14);color:var(--muted)}
.row-act{display:flex;gap:6px}
.dur-row{display:flex;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}

/* snow */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#snow-btn{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--accent-hi);cursor:pointer;opacity:.75;transition:opacity .15s,background .15s}
#snow-btn:hover{opacity:1;background:var(--nav-on)}
#snow-btn[aria-pressed="false"]{color:var(--muted);opacity:.5}
#snow-btn:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}

/* admin accounts */
.acc{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:600 14px var(--ff-body);cursor:pointer;padding:6px 10px;border-radius:12px;flex:none}
.acc:hover{background:rgba(139,92,246,.14)}
.acc:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.av{display:block;object-fit:cover;background:#120d2a;flex:none}
.av.ph{display:grid;place-items:center;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,3,15,.72);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:420px}
.modal-box h2{margin:0 0 18px;font:700 18px var(--ff-head)}
.fld{margin-bottom:14px}
.prof-top{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.prof-btns{display:flex;gap:8px;flex-wrap:wrap}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.staff{display:flex;align-items:center;gap:16px}
.staff h3{margin:0 0 6px}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .nav a{white-space:nowrap}
  .rule-body{padding:18px 16px;gap:14px}
  .num{min-width:42px;font-size:18px}
  .pun{padding:12px 16px}
  .ed-rule{flex-direction:column;padding:16px}
  .ed-actions{flex-direction:row;flex-wrap:wrap}
  .tab{padding:10px 12px;font-size:14px}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var KEY = 'server-rules-draft';
  var app = document.getElementById('app');
  // Редактор включается только по адресу вида ваш-сайт/?edit
  var canEdit = /(^|[?&])edit(=|&|$)/.test(location.search);

  var ICONS = {
    play:  '<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/>',
    cart:  '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 11.5a2 2 0 0 0 2 1.5h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',
    chart: '<path d="M5 21V10M12 21V4M19 21v-7" stroke-width="3.5"/>',
    user:  '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    ban:   '<circle cx="12" cy="12" r="10"/><path d="M5 5l14 14"/>',
    doc:   '<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="currentColor"/>',
    info:  '<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.5"/>',
    star:  '<path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/>',
    link:  '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
  };
  var ICON_NAMES = [['play','Играть'],['cart','Магазин'],['chart','Лидеры'],['user','Игрок'],['ban','Баны'],['doc','Документ'],['info','Информация'],['star','Звезда'],['link','Ссылка']];
  var TYPES = [['rules','Правила (разделы и правила)'],['cards','Карточки (заголовок и текст)'],['link','Ссылка на другой сайт'],['punish','Баны и муты (таблица наказаний)'],['staff','Список администраторов (только для админов)']];

  function icon(name, size){
    size = size || 18;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.doc) + '</svg>';
  }
  var EXT = '<svg class="ext" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : '#'; }

  function defaultData(){
    return { tabs: [{
      id: 'rules', name: 'Правила', icon: 'doc', badge: '', type: 'rules', title: 'Правила', url: '', cards: [],
      cats: [
        { id: 'sec-1', name: 'Основные', rules: [{ t: 'Здесь пишется текст правила. Замените этот пример своим.', p: 'Бан на 7 дней' }] },
        { id: 'sec-2', name: 'Общение', rules: [] },
        { id: 'sec-3', name: 'Игровой процесс', rules: [] },
        { id: 'sec-4', name: 'Никнеймы и аватарки', rules: [] },
        { id: 'sec-5', name: 'Прочее', rules: [] },
        { id: 'sec-6', name: 'Для администрации', rules: [] },
        { id: 'sec-7', name: 'Условия проверки', rules: [] }
      ]
    }]};
  }

  // Приводит данные к нужному виду. Старый формат {title, cats} превращается в одну вкладку «Правила».
  function normalize(d){
    if (!d || typeof d !== 'object') d = {};
    if (!Array.isArray(d.tabs)){
      d = { tabs: [{ id: 'rules', name: 'Правила', icon: 'doc', type: 'rules', title: d.title || 'Правила', cats: Array.isArray(d.cats) ? d.cats : [] }] };
    }
    if (!d.tabs.length) return defaultData();
    var seen = {};
    d.tabs.forEach(function(t, i){
      if (!t.id || seen[t.id]) t.id = uid('p-') + i;
      seen[t.id] = 1;
      t.name = t.name || 'Страница';
      t.icon = ICONS[t.icon] ? t.icon : 'doc';
      t.badge = t.badge || '';
      t.type = (t.type === 'cards' || t.type === 'link' || t.type === 'punish' || t.type === 'staff') ? t.type : 'rules';
      t.title = t.title || t.name;
      t.url = t.url || '';
      t.sburl = t.sburl || '';
      t.skey = t.skey || '';
      t.cats = Array.isArray(t.cats) ? t.cats : [];
      t.cards = Array.isArray(t.cards) ? t.cards : [];
      t.cats.forEach(function(c, j){
        if (!c.id) c.id = 'sec-' + (j + 1);
        c.name = c.name || '';
        c.rules = Array.isArray(c.rules) ? c.rules : [];
        c.rules.forEach(function(r){ r.t = r.t || ''; r.p = r.p || ''; });
      });
      t.cards.forEach(function(c){ c.h = c.h || ''; c.t = c.t || ''; });
    });
    return d;
  }

  var fileData, local = null, saved, draft = null, editing = false, showExport = false;
  var curTabId = '', curCatId = '', armed = null;

  function data(){ return editing ? draft : saved; }
  function tabOf(d){ for (var i = 0; i < d.tabs.length; i++) if (d.tabs[i].id === curTabId) return d.tabs[i]; return d.tabs[0]; }
  function catOf(t){ for (var i = 0; i < t.cats.length; i++) if (t.cats[i].id === curCatId) return t.cats[i]; return t.cats[0]; }
  function parseHash(){ var h = location.hash.slice(1).split('/'); curTabId = h[0] || ''; curCatId = h[1] || ''; }
  function go(tabId, catId){
    curTabId = tabId; curCatId = catId || '';
    try { history.replaceState(null, '', '#' + tabId + (catId ? '/' + catId : '')); } catch (e) {}
    armed = null; render();
  }

  // звёзды
  (function(){
    var sky = document.createElement('div'); sky.className = 'sky';
    for (var i = 0; i < 70; i++){
      var s = document.createElement('i'); s.className = 'star';
      var z = Math.random() < .15 ? 3 : (Math.random() < .5 ? 2 : 1);
      s.style.cssText = 'left:' + (Math.random()*100).toFixed(2) + '%;top:' + (Math.random()*100).toFixed(2) + '%;width:' + z + 'px;height:' + z + 'px;opacity:' + (.25 + Math.random()*.6).toFixed(2);
      sky.appendChild(s);
    }
    document.body.insertBefore(sky, document.body.firstChild);
  })();

  // снег (кнопку выключения запоминает браузер; при «уменьшении анимации» в системе снег по умолчанию выключен)
  (function(){
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var on = true;
    try { var sv = localStorage.getItem('snow'); if (sv === '0') on = false; else if (sv === null && mq && mq.matches) on = false; } catch (e) {}
    var cv = document.createElement('canvas'); cv.id = 'snow'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    var btn = document.createElement('button'); btn.id = 'snow-btn'; btn.type = 'button'; btn.title = 'Снег';
    btn.setAttribute('aria-label', 'Включить или выключить снег');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4.9 7l14.2 10M4.9 17L19.1 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>';
    document.body.appendChild(btn);
    var ctx = cv.getContext('2d'), W = 0, H = 0, flakes = [], raf = 0;
    function make(init){
      var r = Math.random() * 2.6 + .8;
      return { x: Math.random() * W, y: init ? Math.random() * H : -10, r: r, vy: r * .28 + .35, vx: (Math.random() - .5) * .3, ph: Math.random() * 6.28, sw: Math.random() * .6 + .2, a: Math.random() * .5 + .4 };
    }
    function size(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(160, Math.max(50, W * H / 12000)));
      while (flakes.length < n) flakes.push(make(true));
      flakes.length = n;
    }
    function tick(t){
      ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#f3eeff';
      for (var i = 0; i < flakes.length; i++){
        var f = flakes[i];
        f.y += f.vy; f.x += f.vx + Math.sin(t / 1500 + f.ph) * f.sw * .5;
        if (f.y > H + 10 || f.x < -20 || f.x > W + 20){ flakes[i] = make(false); flakes[i].x = Math.random() * W; continue; }
        ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }
    function start(){ if (!raf){ size(); raf = requestAnimationFrame(tick); } cv.hidden = false; }
    function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    function apply(){ btn.setAttribute('aria-pressed', on ? 'true' : 'false'); if (on) start(); else stop(); }
    btn.addEventListener('click', function(){ on = !on; try { localStorage.setItem('snow', on ? '1' : '0'); } catch (e) {} apply(); });
    window.addEventListener('resize', function(){ if (raf) size(); });
    document.addEventListener('visibilitychange', function(){ if (document.hidden){ if (raf){ cancelAnimationFrame(raf); raf = 0; } } else if (on) start(); });
    apply();
  })();

  function btnDel(key, label, disabled){
    var on = armed === key;
    return '<button class="btn small danger' + (on ? ' armed' : '') + '" data-act="del" data-key="' + key + '"' + (disabled ? ' disabled' : '') + '>' + (on ? 'Точно удалить?' : label) + '</button>';
  }

  function swap(arr, i, j){ var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }

  app.addEventListener('click', function(e){
    var ac = e.target.closest('[data-acc]');
    if (ac){ if (ac.dataset.acc === 'login') accLogin(); else accProfile(); return; }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.dataset.act, i = +b.dataset.i, tab, c;
    if (act === 'del'){
      var key = b.dataset.key;

  // ---------- Таблица банов и мутов (Supabase, обычный REST без библиотек) ----------
  var pun = { rows: null, err: '', filter: 'all', q: '', formOpen: false, loginOpen: false, armed: null, session: null, curator: false, uid: null, me: null, profiles: {}, profList: null, curators: {} };
  try { pun.session = JSON.parse(localStorage.getItem('pun-session')); } catch (e) {}

  function punSave(j, email){
    if (!j){ pun.session = null; pun.curator = false; try { localStorage.removeItem('pun-session'); } catch (e) {} return; }
    pun.session = { access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, email: email, uid: (j.user && j.user.id) || (pun.session && pun.session.uid) || null };
    try { localStorage.setItem('pun-session', JSON.stringify(pun.session)); } catch (e) {}
  }
  function punBase(t){ return (t.sburl || '').replace(/\/+$/, ''); }
  async function punEnsure(t){
    var s = pun.session; if (!s || s.exp - 60000 > Date.now()) return;
    try {
      var r = await fetch(punBase(t) + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: t.skey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) throw 0;
      punSave(await r.json(), s.email);
    } catch (e) { punSave(null); }
  }
  async function punFetch(t, path, opts){
    await punEnsure(t);
    opts = opts || {};
    var h = { apikey: t.skey };
    if (pun.session) h.Authorization = 'Bearer ' + pun.session.access_token;
    if (opts.body) h['Content-Type'] = 'application/json';
    if (opts.prefer) h.Prefer = opts.prefer;
    var r = await fetch(punBase(t) + path, { method: opts.method || 'GET', headers: h, body: opts.body });
    if (!r.ok){ var er = new Error('HTTP ' + r.status); er.status = r.status; throw er; }
    return r;
  }
  function punErr(e){
    if (e.status === 401 || e.status === 403) return 'Нет доступа. Проверьте ключ и правила (SQL) в Supabase. Если вы админ, войдите заново.';
    if (e.status === 404) return 'Таблица punishments не найдена. Выполните SQL из инструкции.';
    return 'Не удалось связаться с базой. Проверьте адрес проекта.';
  }
  function punMin(r){ return r.duration_minutes == null ? null : r.duration_minutes; }
  function punLen(m){
    if (m == null) return 'Навсегда';
    if (m % 1440 === 0) return (m / 1440) + ' дн.';
    if (m % 60 === 0) return (m / 60) + ' ч';
    return m + ' мин';
  }
  function punLeft(ms){
    var m = Math.ceil(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    if (d) return d + ' дн. ' + h + ' ч';
    if (h) return h + ' ч ' + mm + ' мин';
    return mm + ' мин';
  }
  function punStatus(r){
    if (r.revoked_at) return { k: 'revoked', t: 'Снят' };
    var m = punMin(r); if (m == null) return { k: 'active', t: 'Действует' };
    var left = new Date(r.created_at).getTime() + m * 60000 - Date.now();
    return left > 0 ? { k: 'active', t: 'Осталось ' + punLeft(left) } : { k: 'ended', t: 'Истёк' };
  }
  function punDate(s){

  }

  function punDrawAuth(){

          '<div><div class="ed-lab">Ник игрока</div><input class="field" id="pa-player" required maxlength="64" autocomplete="off"></div>' +
          '<div><div class="ed-lab">Причина</div><input class="field" id="pa-reason" required maxlength="500" autocomplete="off"></div>' +
          '<div><div class="ed-lab">Админ</div><input class="field" id="pa-admin" required maxlength="64" autocomplete="off" value="' + esc(punAdmin()) + '"></div>' +
          '<div><div class="ed-lab">Срок</div><div class="dur-row"><input class="field" id="pa-num" type="number" min="1" value="1"><select class="field" id="pa-unit"><option value="1">мин.</option><option value="60">ч</option><option value="1440" selected>дн.</option></select></div>' +
          '<label class="chk"><input type="checkbox" id="pa-perm"> Навсегда</label></div></div>' +
          '<div class="ed-panel-actions"><button class="btn primary" type="submit">Добавить</button><span class="status" id="pun-msg"></span></div></form>'
        : '';
    } else {
      act.innerHTML = '<button class="btn small" data-pa="login-toggle">Вход для админов</button>';
      box.innerHTML = '';
    }
  }
  function punAdmin(){ if (pun.me && pun.me.nick) return pun.me.nick; try { return localStorage.getItem('pun-admin') || ''; } catch (e) { return ''; } }
  function punMsg(s){ var m = document.getElementById('pun-msg'); if (m) m.textContent = s; }

  async function punLoad(t){
    pun.err = '';
    try { pun.rows = await (await punFetch(t, '/rest/v1/punishments?select=*&order=created_at.desc&limit=500')).json(); }
    catch (e){ pun.err = punErr(e); }
    await sbLoadMeta(t);
    punDrawTable(); punDrawAuth();
  }

  function punMount(t){
    var root = document.getElementById('pun-root'); if (!root) return;
    if (!t.sburl || !t.skey){
      root.innerHTML = '<div class="empty"><b>Таблица наказаний ещё не подключена.</b>' + (canEdit ? '<br>Откройте «Редактировать» и впишите адрес проекта и ключ в настройках страницы.' : '') + '</div>';
      return;
    }
    root.innerHTML = '<div class="pun-bar"><div class="chips">' +
      [['all','Все'],['ban','Баны'],['mute','Муты'],['active','Действующие']].map(function(f){
        return '<button class="btn small' + (pun.filter === f[0] ? ' on' : '') + '" data-pa="filter" data-v="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div><input class="field" id="pun-q" type="search" placeholder="Поиск по нику" value="' + esc(pun.q) + '" aria-label="Поиск по нику"><span class="sp"></span><span id="pun-actions" style="display:flex;gap:8px;flex-wrap:wrap"></span></div>' +
      '<div id="pun-auth"></div><div id="pun-table"></div>';
    punDrawAuth(); punDrawTable();

    root.addEventListener('input', function(e){
      if (e.target.id === 'pun-q'){ pun.q = e.target.value; punDrawTable(); }
    });
    root.addEventListener('click', function(e){
      var b = e.target.closest('[data-pa]'); if (!b) return;
      var a = b.dataset.pa, id = b.dataset.id;
      if (a !== 'del') pun.armed = null;
      if (a === 'filter'){
        pun.filter = b.dataset.v;
        var bs = root.querySelectorAll('[data-pa=filter]'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i] === b);
        punDrawTable();
      }
      else if (a === 'login-toggle'){ accLogin(); }
      else if (a === 'form-toggle'){ pun.formOpen = !pun.formOpen; punDrawAuth(); var p = document.getElementById('pa-player'); if (p) p.focus(); }
      else if (a === 'logout'){ punSave(null); pun.formOpen = false; punDrawAuth(); punDrawTable(); }
      else if (a === 'revoke'){
        punFetch(t, '/rest/v1/punishments?id=eq.' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ revoked_at: new Date().toISOString() }) })
          .then(function(){ return punLoad(t); }, function(er){ pun.err = punErr(er); punDrawTable(); });
      }
      else if (a === 'del'){
        if (pun.armed !== id){ pun.armed = id; punDrawTable(); return; }
        pun.armed = null;
        punFetch(t, '/rest/v1/punishments?id=eq.' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function(){ return punLoad(t); }, function(er){ pun.err = punErr(er); punDrawTable(); });
      }
    });
    root.addEventListener('submit', async function(e){
      e.preventDefault();
      if (e.target.id === 'pun-add'){
        var perm = document.getElementById('pa-perm').checked;
        var num = parseInt(document.getElementById('pa-num').value, 10);
        if (!perm && !(num > 0)){ punMsg('Укажите срок.'); return; }
        var adm = document.getElementById('pa-admin').value.trim();
        var row = {
          kind: document.getElementById('pa-kind').value,
          player: document.getElementById('pa-player').value.trim(),
          reason: document.getElementById('pa-reason').value.trim(),
          admin: adm,
          duration_minutes: perm ? null : num * parseInt(document.getElementById('pa-unit').value, 10)
        };
        punMsg('Сохраняю…');
        try {
          await punFetch(t, '/rest/v1/punishments', { method: 'POST', body: JSON.stringify(row), prefer: 'return=minimal' });
          try { localStorage.setItem('pun-admin', adm); } catch (er) {}
          document.getElementById('pa-player').value = ''; document.getElementById('pa-reason').value = '';
          punMsg('Добавлено'); punLoad(t);
        } catch (er){ punMsg(er.status === 401 || er.status === 403 ? 'Нет прав. Войдите заново.' : 'Не удалось сохранить.'); }
      }
    });
    punLoad(t);
  }

  // ---------- Профили админов ----------
  function sbCfg(){
    for (var i = 0; i < saved.tabs.length; i++){ var t = saved.tabs[i]; if (t.type === 'punish' && t.sburl && t.skey) return t; }
    return null;
  }
  async function sbLoadMeta(t){
    try {
      var pr = await (await punFetch(t, '/rest/v1/profiles?select=user_id,nick,avatar')).json();
      pun.profList = pr; pun.profiles = {};
      pr.forEach(function(p){ pun.profiles[p.user_id] = p; });
    } catch (e) { if (!pun.profList) pun.profList = []; }
    pun.curators = {};
    if (pun.session){
      try { (await (await punFetch(t, '/rest/v1/curators?select=user_id')).json()).forEach(function(c){ pun.curators[c.user_id] = 1; }); } catch (e) {}
      if (pun.session && !pun.session.uid){
        try {
          var u = await (await punFetch(t, '/auth/v1/user')).json();
          if (u && u.id){ pun.session.uid = u.id; try { localStorage.setItem('pun-session', JSON.stringify(pun.session)); } catch (e2) {} }
        } catch (e) {}
      }
    }
    pun.uid = pun.session ? (pun.session.uid || null) : null;
    pun.me = (pun.uid && pun.profiles[pun.uid]) || null;
    pun.curator = !!(pun.uid && pun.curators[pun.uid]);
  }
  async function accInit(){
    var t = sbCfg(); if (!t) return;
    await punEnsure(t); await sbLoadMeta(t);
    if (!editing) render();
  }

  function avatarHtml(src, name, size){
    var st = 'width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size * .3) + 'px';
    if (src && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(src)) return '<img class="av" style="' + st + '" src="' + src + '" alt="">';
    var ch = name && name !== 'Неизвестно' ? String(name).trim().charAt(0).toUpperCase() : '?';
    return '<span class="av ph" style="' + st + ';font-size:' + Math.round(size * .45) + 'px">' + esc(ch || '?') + '</span>';
  }
  function punWho(r){
    var p = r.admin_id && pun.profiles[r.admin_id];
    var name = (p && p.nick) || r.admin || 'Неизвестно';
    return avatarHtml(p && p.avatar, name, 34) + '<span>' + esc(name) + '</span>';
  }
  function accBtn(){
    if (editing || !sbCfg()) return '';
    if (pun.session){
      return '<button class="acc" data-acc="profile" title="Мой профиль" aria-label="Мой профиль">' + avatarHtml(pun.me && pun.me.avatar, pun.me && pun.me.nick, 34) + '</button>';
    }
    return '<button class="acc" data-acc="login">' + icon('user') + '<span>Вход</span></button>';
  }
  function viewStaff(){
    if (!sbCfg()) return '<div class="empty"><b>Список администраторов ещё не подключён.</b></div>';
    if (!pun.session) return '<div class="empty"><b>Раздел только для администрации.</b><br>Войдите, чтобы увидеть список.<br><button class="btn small" data-acc="login" style="margin-top:12px">Вход для админов</button></div>';
    if (!pun.profList) return '<div class="empty">Загрузка…</div>';
    var list = pun.profList.slice().sort(function(a, b){
      var ca = pun.curators[a.user_id] ? 0 : 1, cb = pun.curators[b.user_id] ? 0 : 1;
      if (ca !== cb) return ca - cb;
      if (!a.nick !== !b.nick) return a.nick ? -1 : 1;
      return String(a.nick).localeCompare(String(b.nick), 'ru');
    });
    if (!list.length) return '<div class="empty"><b>Администраторов пока нет.</b><br>Создайте аккаунты в Supabase и выполните SQL из инструкции.</div>';
    return '<div class="staff-grid">' + list.map(function(p){
      var cur = !!pun.curators[p.user_id];
      return '<article class="card staff">' + avatarHtml(p.avatar, p.nick, 64) + '<div><h3>' + esc(p.nick || 'Без ника') + '</h3><span class="chip ' + (cur ? 'active' : 'mute') + '">' + (cur ? 'Куратор' : 'Админ') + '</span>' +
        (p.nick ? '' : '<div class="status" style="margin-top:6px">Ещё не заполнил профиль</div>') + '</div></article>';
    }).join('') + '</div>';
  }

  function accClose(){ var m = document.getElementById('acc-modal'); if (m) m.remove(); }
  function accOpen(html){
    accClose();
    var m = document.createElement('div'); m.id = 'acc-modal'; m.className = 'modal';
    m.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(m);
    m.addEventListener('mousedown', function(e){ if (e.target === m) accClose(); });
    document.addEventListener('keydown', function esc1(e){ if (e.key === 'Escape'){ accClose(); document.removeEventListener('keydown', esc1); } });
    return m;
  }
  function accLogin(){
    var t = sbCfg(); if (!t) return;
    var m = accOpen('<h2>Вход для админов</h2><form id="acc-login"><div class="fld"><div class="ed-lab">Почта</div><input class="field" id="al-email" type="email" required autocomplete="username"></div>' +
      '<div class="fld"><div class="ed-lab">Пароль</div><input class="field" id="al-pass" type="password" required autocomplete="current-password"></div>' +
      '<div class="ed-panel-actions"><button class="btn primary" type="submit">Войти</button><button class="btn" type="button" data-x="close">Отмена</button><span class="status" id="acc-msg"></span></div></form>');
    document.getElementById('al-email').focus();
    m.addEventListener('click', function(e){ if (e.target.closest('[data-x=close]')) accClose(); });
    m.querySelector('form').addEventListener('submit', async function(e){
      e.preventDefault();
      var msg = document.getElementById('acc-msg'); msg.textContent = 'Вхожу…';
      var email = document.getElementById('al-email').value.trim();
      try {
        var r = await fetch(punBase(t) + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: t.skey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: document.getElementById('al-pass').value }) });
        if (!r.ok) throw new Error('bad');
        punSave(await r.json(), email);
        await sbLoadMeta(t); accClose(); render();
        if (!pun.me || !pun.me.nick) accProfile();
      } catch (er){ msg.textContent = 'Неверная почта или пароль.'; }
    });
  }
  function punResize(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 160;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
        URL.revokeObjectURL(url);
        var q = .85, d = c.toDataURL('image/jpeg', q);
        while (d.length > 60000 && q > .3){ q -= .1; d = c.toDataURL('image/jpeg', q); }
        res(d);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }
  async function accProfile(){
    var t = sbCfg(); if (!t || !pun.session) return;
    if (!pun.uid) await sbLoadMeta(t);
    var me = pun.me || {}, st = { nick: me.nick || '', avatar: me.avatar || null };
    var m = accOpen('<h2>Мой профиль</h2><div class="prof-top"><div id="ap-prev"></div><div class="prof-btns"><label class="btn small" for="ap-file">Загрузить фото</label><input id="ap-file" type="file" accept="image/*" hidden><button class="btn small" type="button" data-x="clear">Убрать фото</button></div></div>' +
      '<div class="fld"><div class="ed-lab">Ник админа</div><input class="field" id="ap-nick" maxlength="32" value="' + esc(st.nick) + '" placeholder="Например: Alex"></div>' +
      '<div class="ed-panel-actions"><button class="btn primary" type="button" data-x="save">Сохранить</button><button class="btn" type="button" data-x="close">Закрыть</button><button class="btn danger" type="button" data-x="logout">Выйти</button><span class="status" id="acc-msg"></span></div>');
    var msg = function(s){ document.getElementById('acc-msg').textContent = s; };
    var prev = function(){ document.getElementById('ap-prev').innerHTML = avatarHtml(st.avatar, st.nick, 88); };
    prev();
    document.getElementById('ap-nick').addEventListener('input', function(e){ st.nick = e.target.value; prev(); });
    document.getElementById('ap-file').addEventListener('change', async function(e){
      var f = e.target.files[0]; if (!f) return;
      try { st.avatar = await punResize(f); prev(); msg(''); } catch (er){ msg('Не удалось прочитать картинку.'); }
    });
    m.addEventListener('click', async function(e){
      var x = e.target.closest('[data-x]'); if (!x) return;
      var k = x.dataset.x;
      if (k === 'close') accClose();
      else if (k === 'clear'){ st.avatar = null; prev(); }
      else if (k === 'logout'){ punSave(null); pun.uid = null; pun.me = null; accClose(); render(); }
      else if (k === 'save'){
        var nick = st.nick.trim();
        if (!nick){ msg('Укажите ник.'); return; }
        if (!pun.uid){ msg('Не удалось определить аккаунт. Войдите заново.'); return; }
        msg('Сохраняю…');
        try {
          await punFetch(t, '/rest/v1/profiles?on_conflict=user_id', { method: 'POST', body: JSON.stringify({ user_id: pun.uid, nick: nick, avatar: st.avatar, updated_at: new Date().toISOString() }), prefer: 'resolution=merge-duplicates,return=minimal' });
          await sbLoadMeta(t); accClose(); render();
        } catch (er){ msg(er.status === 404 ? 'Таблица profiles не найдена. Выполните SQL из инструкции.' : 'Не удалось сохранить. Войдите заново.'); }
      }
    });
  }

  window.addEventListener('hashchange', function(){ parseHash(); armed = null; render(); });

  function start(json){
    fileData = normalize(json);
    if (canEdit){ try { var raw = localStorage.getItem(KEY); if (raw) local = normalize(JSON.parse(raw)); } catch (e) {} }
    saved = local || fileData;
    parseHash(); render(); accInit();
  }

  // Все тексты лежат в файле data.json рядом с index.html
  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('no data'); return r.json(); })
    .then(start, function(){ start(defaultData()); });
})();
</script>
