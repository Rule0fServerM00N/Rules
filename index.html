<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правила сервера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: top tab bar (pages) -> page header -> sidebar of sections + cards. Content lives in data.json */
:root{
  --bg:#0d0920;
  --panel:#171233;
  --card:#1b1538;
  --nav-on:#2b2354;
  --line:rgba(167,139,250,.16);
  --fg:#f4f0ff;
  --muted:#a59dc6;
  --accent:#8b5cf6;
  --accent-hi:#b39bff;
  --warn-bg:#2a2016;
  --warn-fg:#f5a524;
  --danger:#f0647a;
  --badge:#e5484d;
  --ff-head:'Unbounded','Onest',system-ui,sans-serif;
  --ff-body:'Onest',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 var(--ff-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 15% 0%,rgba(139,92,246,.20),transparent 70%),
             radial-gradient(ellipse 50% 40% at 100% 100%,rgba(109,40,217,.14),transparent 70%)}
.sky::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.7),transparent)}
.star{position:absolute;border-radius:50%;background:#e9e1ff}
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto}

/* top tabs */
.tabs{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:28px;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap;flex:none;transition:background .15s}
.tab:hover{background:rgba(139,92,246,.14)}
.tab.on{background:var(--nav-on)}
.tab svg{flex:none}
.tab .ext{opacity:.55}
.tb{background:var(--badge);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;line-height:1.4}
.tabs .btn{flex:none}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.top svg{flex:none;color:var(--accent)}
.top h1{margin:0;font:700 clamp(22px,4vw,30px)/1.1 var(--ff-head);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.top .grow{flex:1}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{color:var(--muted);font-size:13px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
.nav{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px}
.nav a{display:block;padding:12px 14px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;overflow-wrap:anywhere;transition:background .15s}
.nav a:hover{background:rgba(139,92,246,.14)}
.nav a.on{background:var(--nav-on)}
a:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.nav .add{margin-top:6px}

.rules{display:flex;flex-direction:column;gap:16px;min-width:0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rule-body{display:flex;gap:18px;align-items:flex-start;padding:22px 24px;min-width:0}
.num{flex:none;font:600 22px/1.2 var(--ff-head);color:var(--fg);min-width:52px}
.rule-body p{margin:0;font-weight:600;font-size:15px;white-space:pre-line;overflow-wrap:anywhere;min-width:0;text-wrap:pretty}
.pun{background:var(--warn-bg);color:var(--warn-fg);padding:14px 24px;font-weight:500;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 24px;color:var(--muted)}
.empty b{color:var(--fg)}
.empty a{color:var(--accent-hi)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.card h3{margin:0 0 8px;font:700 17px/1.3 var(--ff-head);overflow-wrap:anywhere}
.card p{margin:0;color:#d9d2f2;white-space:pre-line;overflow-wrap:anywhere}

.btn{font:600 14px var(--ff-body);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:10px 16px;border-radius:10px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--nav-on);border-color:rgba(167,139,250,.4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#7c4be8}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#1a0610}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.field{display:block;width:100%;background:#120d2a;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 15px/1.5 var(--ff-body)}
.field:focus{border-color:var(--accent-hi);outline:none}
textarea.field{resize:vertical;min-height:48px;overflow:hidden}
.ed-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.ed-head .field{flex:1;min-width:180px;font-weight:700}
.ed-rule{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:16px;min-width:0}
.ed-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ed-lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.ed-actions{display:flex;flex-direction:column;gap:6px;flex:none}

.ed-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:24px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ed-panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ed-panel h2{margin:0 0 14px;font:600 13px var(--ff-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.export{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.export h2{margin:0 0 8px;font:600 16px var(--ff-head)}
.export p{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:72ch}
.export textarea.field{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;height:260px;overflow:auto;resize:vertical;margin-bottom:12px}
.export code{color:var(--accent-hi)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .nav a{white-space:nowrap}
  .rule-body{padding:18px 16px;gap:14px}
  .num{min-width:42px;font-size:18px}
  .pun{padding:12px 16px}
  .ed-rule{flex-direction:column;padding:16px}
  .ed-actions{flex-direction:row;flex-wrap:wrap}
  .tab{padding:10px 12px;font-size:14px}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var KEY = 'server-rules-draft';
  var app = document.getElementById('app');
  // Редактор включается только по адресу вида ваш-сайт/?edit
  var canEdit = /(^|[?&])edit(=|&|$)/.test(location.search);

  var ICONS = {
    play:  '<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/>',
    cart:  '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 11.5a2 2 0 0 0 2 1.5h7.6a2 2 0 0 0 2-1.5L21 7H6"/>',
    chart: '<path d="M5 21V10M12 21V4M19 21v-7" stroke-width="3.5"/>',
    user:  '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    ban:   '<circle cx="12" cy="12" r="10"/><path d="M5 5l14 14"/>',
    doc:   '<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="currentColor"/>',
    info:  '<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.5"/>',
    star:  '<path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/>',
    link:  '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
  };
  var ICON_NAMES = [['play','Играть'],['cart','Магазин'],['chart','Лидеры'],['user','Игрок'],['ban','Баны'],['doc','Документ'],['info','Информация'],['star','Звезда'],['link','Ссылка']];
  var TYPES = [['rules','Правила (разделы и правила)'],['cards','Карточки (заголовок и текст)'],['link','Ссылка на другой сайт']];

  function icon(name, size){
    size = size || 18;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.doc) + '</svg>';
  }
  var EXT = '<svg class="ext" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : '#'; }

  function defaultData(){
    return { tabs: [{
      id: 'rules', name: 'Правила', icon: 'doc', badge: '', type: 'rules', title: 'Правила', url: '', cards: [],
      cats: [
        { id: 'sec-1', name: 'Основные', rules: [{ t: 'Здесь пишется текст правила. Замените этот пример своим.', p: 'Бан на 7 дней' }] },
        { id: 'sec-2', name: 'Общение', rules: [] },
        { id: 'sec-3', name: 'Игровой процесс', rules: [] },
        { id: 'sec-4', name: 'Никнеймы и аватарки', rules: [] },
        { id: 'sec-5', name: 'Прочее', rules: [] },
        { id: 'sec-6', name: 'Для администрации', rules: [] },
        { id: 'sec-7', name: 'Условия проверки', rules: [] }
      ]
    }]};
  }

  // Приводит данные к нужному виду. Старый формат {title, cats} превращается в одну вкладку «Правила».
  function normalize(d){
    if (!d || typeof d !== 'object') d = {};
    if (!Array.isArray(d.tabs)){
      d = { tabs: [{ id: 'rules', name: 'Правила', icon: 'doc', type: 'rules', title: d.title || 'Правила', cats: Array.isArray(d.cats) ? d.cats : [] }] };
    }
    if (!d.tabs.length) return defaultData();
    var seen = {};
    d.tabs.forEach(function(t, i){
      if (!t.id || seen[t.id]) t.id = uid('p-') + i;
      seen[t.id] = 1;
      t.name = t.name || 'Страница';
      t.icon = ICONS[t.icon] ? t.icon : 'doc';
      t.badge = t.badge || '';
      t.type = (t.type === 'cards' || t.type === 'link') ? t.type : 'rules';
      t.title = t.title || t.name;
      t.url = t.url || '';
      t.cats = Array.isArray(t.cats) ? t.cats : [];
      t.cards = Array.isArray(t.cards) ? t.cards : [];
      t.cats.forEach(function(c, j){
        if (!c.id) c.id = 'sec-' + (j + 1);
        c.name = c.name || '';
        c.rules = Array.isArray(c.rules) ? c.rules : [];
        c.rules.forEach(function(r){ r.t = r.t || ''; r.p = r.p || ''; });
      });
      t.cards.forEach(function(c){ c.h = c.h || ''; c.t = c.t || ''; });
    });
    return d;
  }

  var fileData, local = null, saved, draft = null, editing = false, showExport = false;
  var curTabId = '', curCatId = '', armed = null;

  function data(){ return editing ? draft : saved; }
  function tabOf(d){ for (var i = 0; i < d.tabs.length; i++) if (d.tabs[i].id === curTabId) return d.tabs[i]; return d.tabs[0]; }
  function catOf(t){ for (var i = 0; i < t.cats.length; i++) if (t.cats[i].id === curCatId) return t.cats[i]; return t.cats[0]; }
  function parseHash(){ var h = location.hash.slice(1).split('/'); curTabId = h[0] || ''; curCatId = h[1] || ''; }
  function go(tabId, catId){
    curTabId = tabId; curCatId = catId || '';
    try { history.replaceState(null, '', '#' + tabId + (catId ? '/' + catId : '')); } catch (e) {}
    armed = null; render();
  }

  // звёзды
  (function(){
    var sky = document.createElement('div'); sky.className = 'sky';
    for (var i = 0; i < 70; i++){
      var s = document.createElement('i'); s.className = 'star';
      var z = Math.random() < .15 ? 3 : (Math.random() < .5 ? 2 : 1);
      s.style.cssText = 'left:' + (Math.random()*100).toFixed(2) + '%;top:' + (Math.random()*100).toFixed(2) + '%;width:' + z + 'px;height:' + z + 'px;opacity:' + (.25 + Math.random()*.6).toFixed(2);
      sky.appendChild(s);
    }
    document.body.insertBefore(sky, document.body.firstChild);
  })();

  function btnDel(key, label, disabled){
    var on = armed === key;
    return '<button class="btn small danger' + (on ? ' armed' : '') + '" data-act="del" data-key="' + key + '"' + (disabled ? ' disabled' : '') + '>' + (on ? 'Точно удалить?' : label) + '</button>';
  }
  function opts(list, val){
    return list.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
  }

  function tabsBar(d, t){
    var html = d.tabs.map(function(tab){
      var isLink = tab.type === 'link' && !editing;
      var on = tab.id === t.id && !isLink;
      return '<a class="tab' + (on ? ' on' : '') + '" data-tid="' + esc(tab.id) + '" href="' + esc(isLink ? safeUrl(tab.url) : '#' + tab.id) + '"' +
        (isLink ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + icon(tab.icon) +
        '<span class="tl">' + esc(tab.name) + '</span><span class="tb"' + (tab.badge ? '' : ' hidden') + '>' + esc(tab.badge) + '</span>' + (isLink ? EXT : '') + '</a>';
    }).join('');
    if (editing) html += '<button class="btn small" data-act="addTab">+ Страница</button>';
    return '<nav class="tabs" aria-label="Страницы сайта">' + html + '</nav>';
  }

  function tools(){
    if (!canEdit) return '';
    if (editing) return '<button class="btn" data-act="cancel">Отмена</button><button class="btn primary" data-act="save">Сохранить</button>';
    return (local ? '<span class="status">Черновик в браузере</span>' + btnDel('reset', 'Сбросить к файлу') : '') +
      '<button class="btn" data-act="export">Данные для файла</button>' +
      '<button class="btn primary" data-act="edit">Редактировать</button>';
  }

  function tabPanel(d, t){
    var i = d.tabs.indexOf(t);
    return '<section class="ed-panel"><h2>Настройки страницы</h2><div class="ed-grid">' +
      '<div><div class="ed-lab">Название в меню</div><input class="field" id="f-name" data-f="tname" value="' + esc(t.name) + '"></div>' +
      '<div><div class="ed-lab">Значок</div><select class="field" id="f-icon" data-f="ticon">' + opts(ICON_NAMES, t.icon) + '</select></div>' +
      '<div><div class="ed-lab">Красная метка (необязательно)</div><input class="field" id="f-badge" data-f="tbadge" value="' + esc(t.badge) + '" placeholder="Например: -50%"></div>' +
      '<div><div class="ed-lab">Что на странице</div><select class="field" id="f-type" data-f="ttype">' + opts(TYPES, t.type) + '</select></div>' +
      (t.type === 'link' ? '<div><div class="ed-lab">Адрес ссылки</div><input class="field" id="f-url" data-f="turl" value="' + esc(t.url) + '" placeholder="https://discord.gg/..."></div>' : '') +
      '</div><div class="ed-panel-actions">' +
      '<button class="btn small" data-act="tabLeft"' + (i === 0 ? ' disabled' : '') + '>← Левее</button>' +
      '<button class="btn small" data-act="tabRight"' + (i === d.tabs.length - 1 ? ' disabled' : '') + '>Правее →</button>' +
      btnDel('tab', 'Удалить страницу', d.tabs.length < 2) + '</div></section>';
  }

  function viewRules(c, ci){
    if (!c || !c.rules.length) return '<div class="empty"><b>В этом разделе пока нет правил.</b></div>';
    return c.rules.map(function(r, i){
      return '<article class="rule"><div class="rule-body"><span class="num">' + (ci+1) + '.' + (i+1) + '</span><p>' + esc(r.t) + '</p></div>' +
        (r.p && r.p.trim() ? '<div class="pun">Наказание: ' + esc(r.p) + '</div>' : '') + '</article>';
    }).join('');
  }
  function editRules(c, ci){
    if (!c) return '<div class="empty"><b>Разделов нет.</b> Нажмите «+ Раздел» слева.</div>';
    var head = '<div class="ed-head"><input class="field" id="cat-name" data-f="cat" value="' + esc(c.name) + '" aria-label="Название раздела">' + btnDel('cat', 'Удалить раздел') + '</div>';
    var list = c.rules.map(function(r, i){
      return '<div class="ed-rule"><span class="num">' + (ci+1) + '.' + (i+1) + '</span><div class="ed-fields">' +
        '<div><div class="ed-lab">Текст правила</div><textarea class="field" id="rt-' + i + '" data-f="t" data-i="' + i + '" rows="2">' + esc(r.t) + '</textarea></div>' +
        '<div><div class="ed-lab">Наказание</div><input class="field" id="rp-' + i + '" data-f="p" data-i="' + i + '" value="' + esc(r.p) + '" placeholder="Например: Бан на 30 дней"></div>' +
        '</div><div class="ed-actions">' +
        '<button class="btn small" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Выше">↑</button>' +
        '<button class="btn small" data-act="down" data-i="' + i + '"' + (i === c.rules.length-1 ? ' disabled' : '') + ' aria-label="Ниже">↓</button>' +
        btnDel('r' + i, 'Удалить') + '</div></div>';
    }).join('');
    return head + list + '<div><button class="btn" data-act="addRule">+ Добавить правило</button></div>';
  }

  function viewCards(t){
    if (!t.cards.length) return '<div class="empty"><b>На этой странице пока ничего нет.</b></div>';
    return '<div class="cards">' + t.cards.map(function(c){
      return '<article class="card">' + (c.h.trim() ? '<h3>' + esc(c.h) + '</h3>' : '') + '<p>' + esc(c.t) + '</p></article>';
    }).join('') + '</div>';
  }
  function editCards(t){
    var list = t.cards.map(function(c, i){
      return '<div class="ed-rule"><div class="ed-fields">' +
        '<div><div class="ed-lab">Заголовок</div><input class="field" id="ch-' + i + '" data-f="ch" data-i="' + i + '" value="' + esc(c.h) + '"></div>' +
        '<div><div class="ed-lab">Текст</div><textarea class="field" id="ct-' + i + '" data-f="ct" data-i="' + i + '" rows="3">' + esc(c.t) + '</textarea></div>' +
        '</div><div class="ed-actions">' +
        '<button class="btn small" data-act="cup" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Выше">↑</button>' +
        '<button class="btn small" data-act="cdown" data-i="' + i + '"' + (i === t.cards.length-1 ? ' disabled' : '') + ' aria-label="Ниже">↓</button>' +
        btnDel('c' + i, 'Удалить') + '</div></div>';
    }).join('');
    return '<div class="rules">' + list + '<div><button class="btn" data-act="addCard">+ Добавить карточку</button></div></div>';
  }

  function exportPanel(){
    var json = JSON.stringify(saved, null, 2);
    return '<section class="export"><h2>Данные для data.json</h2>' +
      '<p>Правки сохранены только в этом браузере. Чтобы их увидели все: скопируйте текст ниже, откройте файл <code>data.json</code> на GitHub, нажмите карандаш, выделите всё (Ctrl+A), вставьте (Ctrl+V) и нажмите Commit changes.</p>' +
      '<textarea class="field" id="exp" readonly>' + esc(json) + '</textarea>' +
      '<button class="btn primary" data-act="copy">Скопировать</button> <span class="status" id="copy-msg"></span></section>';
  }

  function render(){
    var d = data(), t = tabOf(d);
    curTabId = t.id;
    document.title = t.title || 'Правила сервера';
    var layoutCls = 'layout', side = '', main;
    if (t.type === 'rules'){
      var c = catOf(t); if (c) curCatId = c.id;
      var ci = c ? t.cats.indexOf(c) : 0;
      side = '<nav class="nav" aria-label="Разделы">' + t.cats.map(function(k){
        return '<a href="#' + esc(t.id) + '/' + esc(k.id) + '" class="' + (c && k.id === c.id ? 'on' : '') + '">' + esc(k.name || 'Без названия') + '</a>';
      }).join('') + (editing ? '<button class="btn small add" data-act="addCat">+ Раздел</button>' : '') + '</nav>';
      main = editing ? editRules(c, ci) : viewRules(c, ci);
    } else if (t.type === 'cards'){
      layoutCls += ' single';
      main = editing ? editCards(t) : viewCards(t);
    } else {
      layoutCls += ' single';
      main = editing
        ? '<div class="empty"><b>Эта вкладка ведёт на другой сайт.</b><br>Впишите адрес в настройках страницы выше.</div>'
        : '<div class="empty"><b>Эта страница — ссылка на другой сайт.</b><br>' + (t.url ? '<a href="' + esc(safeUrl(t.url)) + '" target="_blank" rel="noopener noreferrer">Открыть</a>' : 'Адрес ещё не указан.') + '</div>';
    }
    var title = editing
      ? '<input class="field" id="site-title" data-f="ttitle" value="' + esc(t.title) + '" aria-label="Заголовок страницы" style="max-width:420px;font:700 20px var(--ff-head);text-transform:uppercase">'
      : '<h1>' + esc(t.title) + '</h1>';
    app.innerHTML = tabsBar(d, t) +
      '<header class="top">' + icon(t.icon, 28) + title + '<span class="grow"></span><div class="tools">' + tools() + '</div></header>' +
      (editing ? tabPanel(d, t) : '') +
      '<div class="' + layoutCls + '">' + side + '<main class="rules">' + main + '</main></div>' +
      (canEdit && showExport && !editing ? exportPanel() : '');
    var tas = app.querySelectorAll('textarea:not([readonly])'); for (var i = 0; i < tas.length; i++) autosize(tas[i]);
  }

  function autosize(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

  function live(tab){
    var el = app.querySelector('.tab[data-tid="' + tab.id + '"]'); if (!el) return;
    el.querySelector('.tl').textContent = tab.name;
    var b = el.querySelector('.tb'); b.textContent = tab.badge; b.hidden = !tab.badge;
  }

  app.addEventListener('input', function(e){
    var el = e.target, f = el.dataset && el.dataset.f; if (!f || !draft) return;
    var tab = tabOf(draft), i = +el.dataset.i;
    if (f === 'ttitle') tab.title = el.value;
    else if (f === 'tname'){ tab.name = el.value; live(tab); }
    else if (f === 'tbadge'){ tab.badge = el.value; live(tab); }
    else if (f === 'turl') tab.url = el.value;
    else if (f === 'ticon'){ tab.icon = el.value; render(); return; }
    else if (f === 'ttype'){ tab.type = el.value; render(); return; }
    else if (f === 'cat') catOf(tab).name = el.value;
    else if (f === 't' || f === 'p') catOf(tab).rules[i][f] = el.value;
    else if (f === 'ch') tab.cards[i].h = el.value;
    else if (f === 'ct') tab.cards[i].t = el.value;
    if (el.tagName === 'TEXTAREA') autosize(el);
  });

  function swap(arr, i, j){ var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }

  app.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.dataset.act, i = +b.dataset.i, tab, c;
    if (act === 'del'){
      var key = b.dataset.key;
      if (armed !== key){ armed = key; render(); return; }
      armed = null;
      if (key === 'reset'){
        try { localStorage.removeItem(KEY); } catch (err) {}
        local = null; saved = fileData; render(); return;
      }
      tab = tabOf(draft);
      if (key === 'tab'){ draft.tabs.splice(draft.tabs.indexOf(tab), 1); curTabId = draft.tabs[0].id; curCatId = ''; }
      else if (key === 'cat'){ tab.cats.splice(tab.cats.indexOf(catOf(tab)), 1); curCatId = ''; }
      else if (key.charAt(0) === 'r') catOf(tab).rules.splice(+key.slice(1), 1);
      else if (key.charAt(0) === 'c') tab.cards.splice(+key.slice(1), 1);
      render(); return;
    }
    armed = null;
    if (act === 'edit'){ draft = JSON.parse(JSON.stringify(saved)); editing = true; showExport = false; render(); }
    else if (act === 'cancel'){ editing = false; draft = null; render(); }
    else if (act === 'save'){
      saved = normalize(JSON.parse(JSON.stringify(draft))); local = saved;
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (err) {}
      editing = false; draft = null; showExport = true; render();
      var ex = document.getElementById('exp'); if (ex) ex.scrollIntoView({block:'center'});
    }
    else if (act === 'export'){ showExport = !showExport; render(); }
    else if (act === 'copy'){
      var ta = document.getElementById('exp'), m = document.getElementById('copy-msg');
      var sel = function(){ ta.focus(); ta.select(); if (m) m.textContent = 'Выделено, нажмите Ctrl+C'; };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ if (m) m.textContent = 'Скопировано'; }, sel);
      } else sel();
    }
    else if (act === 'addTab'){
      var n = { id: uid('p-'), name: 'Новая страница', icon: 'info', badge: '', type: 'cards', title: 'Новая страница', url: '', cats: [], cards: [] };
      draft.tabs.push(n); go(n.id);
      var f = document.getElementById('f-name'); if (f){ f.focus(); f.select(); }
    }
    else if (act === 'tabLeft'){ tab = tabOf(draft); i = draft.tabs.indexOf(tab); if (i > 0){ swap(draft.tabs, i, i-1); render(); } }
    else if (act === 'tabRight'){ tab = tabOf(draft); i = draft.tabs.indexOf(tab); if (i < draft.tabs.length-1){ swap(draft.tabs, i, i+1); render(); } }
    else if (act === 'addRule'){ catOf(tabOf(draft)).rules.push({t:'', p:''}); render(); var tas = app.querySelectorAll('textarea'); if (tas.length) tas[tas.length-1].focus(); }
    else if (act === 'up'){ c = catOf(tabOf(draft)); swap(c.rules, i, i-1); render(); }
    else if (act === 'down'){ c = catOf(tabOf(draft)); swap(c.rules, i, i+1); render(); }
    else if (act === 'addCat'){
      tab = tabOf(draft); var k = {id: uid('sec-'), name: 'Новый раздел', rules: []}; tab.cats.push(k); curCatId = k.id; render();
      var fc = document.getElementById('cat-name'); if (fc){ fc.focus(); fc.select(); }
    }
    else if (act === 'addCard'){ tab = tabOf(draft); tab.cards.push({h:'', t:''}); render(); var ch = document.getElementById('ch-' + (tab.cards.length-1)); if (ch) ch.focus(); }
    else if (act === 'cup'){ tab = tabOf(draft); swap(tab.cards, i, i-1); render(); }
    else if (act === 'cdown'){ tab = tabOf(draft); swap(tab.cards, i, i+1); render(); }
  });

  window.addEventListener('hashchange', function(){ parseHash(); armed = null; render(); });

  function start(json){
    fileData = normalize(json);
    if (canEdit){ try { var raw = localStorage.getItem(KEY); if (raw) local = normalize(JSON.parse(raw)); } catch (e) {} }
    saved = local || fileData;
    parseHash(); render();
  }

  // Все тексты лежат в файле data.json рядом с index.html
  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('no data'); return r.json(); })
    .then(start, function(){ start(defaultData()); });
})();
</script>
</body>
</html>
